name: 앱 빌드 (APK + IPA)

on:
  push:
    branches:
      - main
      - claude/handwritten-diary-ai-app-q4vggn
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: 테스트
        run: flutter test

      - name: Re:Me APK 빌드 (Gemini 키는 저장소 Secrets에서 주입)
        run: >
          flutter build apk --release --flavor reme
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: ENTP APK 빌드
        run: >
          flutter build apk --release --flavor coach
          --dart-define=APP_MODE=coach
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: secret-diary-android
          path: |
            build/app/outputs/flutter-apk/app-reme-release.apk
            build/app/outputs/flutter-apk/app-coach-release.apk

  ios:
    name: iOS IPA (서명 없음 — Sideloadly/AltStore로 설치)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: Re:Me iOS 빌드 (코드서명 없이)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Re:Me IPA 패키징
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr secret-diary.ipa Payload
          rm -rf Payload

      - name: ENTP iOS 빌드 (앱 ID·이름 분리 후 코드서명 없이)
        run: |
          # 아이폰에 Re:Me와 나란히 설치되도록 번들 ID와 표시 이름을 바꾼다.
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = dev\.secretdiary\.secretDiary;/PRODUCT_BUNDLE_IDENTIFIER = dev.secretdiary.coach;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ENTP" ios/Runner/Info.plist
          flutter build ios --release --no-codesign \
            --dart-define=APP_MODE=coach \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: ENTP IPA 패키징
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr coach.ipa Payload

      - name: IPA 업로드
        uses: actions/upload-artifact@v4
        with:
          name: secret-diary-ios
          path: |
            secret-diary.ipa
            coach.ipa

  release:
    name: Releases에 등록 (로그인 없이 다운로드)
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - name: 아티팩트 내려받기
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: APK 이름 정리
        run: |
          mv app-reme-release.apk secret-diary.apk
          mv app-coach-release.apk coach.apk

      - name: Release 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Re:Me 빌드 build-${{ github.run_number }}"
          body: |
            ✍️ Re:Me — 일기를 쓰면, 답장이 와요.
            - `secret-diary.apk` — Re:Me (손글씨 일기), Android 폰에서 바로 설치
            - `coach.apk` — ENTP (고민을 들어주고 핵심을 찌르는 직설 상담), Android용
            - `secret-diary.ipa` — Re:Me iPhone용, PC의 Sideloadly로 설치
            - `coach.ipa` — ENTP iPhone용, PC의 Sideloadly로 설치
          files: |
            secret-diary.apk
            coach.apk
            secret-diary.ipa
            coach.ipa
